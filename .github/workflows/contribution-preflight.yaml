name: Fork contribution preflight

on:
  workflow_dispatch:
    inputs:
      patch:
        description: Submission branch, or all four branches
        type: choice
        default: all
        options:
          - all
          - fix-sd-decoder-rows
          - fix-bmi2-test-registration
          - fix-logging-test-cleanup
          - test-four-component-decomposition
      compiler:
        description: Compiler platform, or the complete matrix
        type: choice
        default: all
        options: [all, gcc, clang, windows]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      # Jobs use separate disposable runners; each runner builds serially with
      # two compiler processes and never shares the local development checkout.
      max-parallel: 3
      matrix:
        patch: ${{ fromJSON(inputs.patch == 'all' && '["fix-sd-decoder-rows","fix-bmi2-test-registration","fix-logging-test-cleanup","test-four-component-decomposition"]' || format('["{0}"]', inputs.patch)) }}
        platform: ${{ fromJSON(inputs.compiler == 'all' && '["gcc","clang","windows"]' || format('["{0}"]', inputs.compiler)) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.patch }}
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.platform == 'clang' && matrix.patch != 'fix-bmi2-test-registration'
        with:
          ref: 66adfcd86bc5504d49fe49e74fb1e6960e300163
          path: registration-prerequisite
          fetch-depth: 2
      - name: Apply and record Clang test-registration prerequisite
        if: matrix.platform == 'clang' && matrix.patch != 'fix-bmi2-test-registration'
        shell: bash
        run: |
          mkdir -p source/preflight-results
          git -C registration-prerequisite diff 4d7e116c3ef259529a0917060e5b113834ed4894 HEAD > source/preflight-results/test-registration.patch
          git -C registration-prerequisite rev-parse HEAD > source/preflight-results/test-registration-revision.txt
          git -C source apply preflight-results/test-registration.patch
          git -C source diff --stat
      - name: Install Linux tools
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          # Use Ubuntu's public mirror instead of a slow regional Azure mirror.
          for mirrors in /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [[ -f "$mirrors" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$mirrors"
            fi
          done
          options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y nasm ninja-build valgrind clang clang-format
      - name: Install Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - name: Build and test selected patch
        shell: bash
        run: python automation/.github/contribution/validate.py source "${{ matrix.platform }}" "${{ matrix.patch }}"
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.patch }}-${{ matrix.platform }}
          path: source/preflight-results/
          if-no-files-found: error
          retention-days: 14
